name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for OIDC — no static cloud secret needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Assume cloud deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/demo-deploy-role
          aws-region: us-east-1
      - name: Deploy (placeholder)
        run: echo "Deploying — no long-lived credential was used."
